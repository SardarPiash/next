services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minimarket
      POSTGRES_PASSWORD: minimarket
      POSTGRES_DB: minimarket
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6381:6379"]
volumes:
  pgdata: